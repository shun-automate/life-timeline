<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生年表</title>
<style>
  :root{
    --bg:#faf7f2;
    --card:#ffffff;
    --line:#e4ddd0;
    --ink:#2b2620;
    --sub:#8a8072;
    --accent:#d97a4d;
    --accent-soft:#f6e3d6;
    --pos:#1d9e75;
    --pos-bg:#e1f5ee;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior-y: contain;
  }
  body{padding-bottom:40px;}

  header{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:18px 20px 10px;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-size:20px; font-weight:600; letter-spacing:.02em;
  }
  header p{
    font-size:12px; color:var(--sub); margin-top:4px;
  }

  nav.stages{
    display:flex; gap:6px; overflow-x:auto;
    padding:12px 20px 4px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  nav.stages::-webkit-scrollbar{display:none;}
  nav.stages button{
    flex:0 0 auto;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--sub);
    white-space:nowrap;
  }
  nav.stages button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  nav.stages button:active{ transform:scale(0.96); }

  main{
    padding:8px 18px 0;
    position:relative;
  }

  .yeargroup{
    position:relative;
    padding-left:24px;
    margin-top:26px;
  }
  .yeargroup::before{
    content:"";
    position:absolute;
    left:6px; top:6px; bottom:-20px;
    width:1px;
    background:var(--line);
  }
  .yeargroup:last-child::before{ display:none; }
  .yeargroup .dot{
    position:absolute; left:0; top:2px;
    width:13px; height:13px; border-radius:50%;
    background:var(--accent);
    border:2px solid var(--bg);
    box-shadow:0 0 0 1px var(--accent);
  }
  .yeargroup .yearlabel{
    font-size:13px; font-weight:600; color:var(--accent);
    margin-bottom:2px;
  }
  .yeargroup .stagelabel{
    font-size:11px; color:var(--sub); margin-bottom:10px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .card .fact{
    font-size:14px; font-weight:500; line-height:1.55;
    cursor:pointer;
  }
  .card .fact::before{
    content:"●";
    font-size:6px;
    color:var(--accent);
    margin-right:8px;
    vertical-align:middle;
  }
  .card .feel{
    display:none;
    margin-top:8px;
    padding:10px 12px;
    background:var(--accent-soft);
    border-radius:10px;
    font-size:13px;
    line-height:1.7;
    color:#5c4632;
    white-space:pre-line;
  }
  .card.open .feel{ display:block; }
  .card .nofeel{ opacity:.4; }

  .empty{
    font-size:13px; color:var(--sub);
    padding:6px 0 2px;
  }

  footer{
    text-align:center; font-size:11px; color:var(--sub);
    padding:30px 20px 10px;
  }
</style>
</head>
<body>

<header>
  <h1>人生年表</h1>
  <p>タップで詳細（その時の感情）が開きます</p>
</header>

<nav class="stages" id="stageNav"></nav>

<main id="main"></main>

<footer>2001 - 2026 ／ 更新中</footer>

      ["中学では主に2か所の小学校の子が集まった","入学式で知ってる人が半分、知らない人が半分で不思議な感覚だった、新線のようで新鮮じゃない延長線の何かを感じていた、自宅からの距離も150歩とめっちゃ近距離だったから余計なのかも"],
      ["テニス部に入った","年間10日間しか休みがない鬼の部活に入った、小学校からの友達も多く幼稚園から高校まで一緒に過ごす男子4人が同じテニス部だった、後の団体メンバーに4人とも選ばれる、進学校も偏差値68くらいあってみんな受かるし、同じ幼稚園のメンバーのスペックの高さは今でも驚かされる、でも自分が高校で落ちたようにみんな高校で上位じゃなくなるのが同じところもまた似た何かを感じた\n\nテニス部の日々は苦痛と楽しさの入り交じりだった、これまでピアノとか囲碁将棋クラブの人間が急に運動部に入ったもんだから最初は何度吐いたことか、小学生まで給食でおかわりしたことのなかった人間が急におかわりし始めた、中学校の3年間でおかわりしなかったことはない、残したこともない、クラスで大食いメンバーだった\n\n後の親友は別の小学校の子でテニス経験者で最初から上級生たちと練習をしていた、未経験のメンバーは2か月間ほとんど素振りしかしてこなかった、最初は何のための素振りだろうと何度思ったことか、でも2か月間の素振りが苦痛過ぎて辞めたいなんて思った記憶はない、むしろ上手い人のプレーを見ながら素振りしてたから見る目を養えたかと思ってる、テニス部の中でもやっぱり頭が良い側と悪い側になんとなく分かれるし、良い側はテニスも上手い側にいた、自分だけ頭が良い側にいつつテニスが下手な側にいるような気がしてそれが嫌だった、別にいじめがあったわけでもないし何となくの雰囲気だけどテニスで上手い側になりたくて頑張ってた"],
      ["ピアノ教室を辞めた","テニスに打ち込む日々が続いてピアノの練習がしんどくなったから辞めた"],

{y:"2015年", age:14, stage:"中2", events:[
      ["朝練がマラソン大会化する","テニス部の日々の朝練は40分くらいあって、顧問が3人いたが鬼顧問の人がキレると練習がより地獄化する、朝からキレてた時は40分間マラソンさせられる、授業が始まる前から死ぬ、辛すぎた、マジで嫌だった"],
      ["朝5時半から学校へ行って教頭先生に怒られた","休日は8時半までにコート外周4周とストレッチをして練習できる状態にしておくのがルーティーンだった、家が近いし上手くなりたかった自分は6時前後から練習しに行ってた、最初の1人になることも多かった、5時半に行けた日がたまたま上級生の修学旅行の日で先生たちも早く、教頭先生に早すぎだと怒られて7時まで来るなと家に帰された、場所空いてるからいいだろと思いつつ一旦帰ってバスが出発した後6時過ぎにすぐ登校して練習した、教頭先生にはバレてたのかわからないが何も言われなかった、やる気があるならやった方がいいだろとしか思ってなかった"],
      ["ボカロ曲にハマってピアノを再開する","担任の先生が25～30歳くらいの男性でボカロ好きだった、その影響でボカロの曲ってクラシックと違って自分的には乗れる曲が多いなと思ってハマった、ピアノ教室は辞めてしまったが再度ピアノ弾きたい欲が強まった、初音ミクの消失を最初聞いたときに衝撃過ぎてこれを最初に弾けるように頑張った、難易度高すぎたけど弾けるようになるのが楽しかった、六兆年と一夜物語、カゲロウデイズ、君の知らない物語とかを弾いていた記憶がある、特に学校で披露することはなかったが勉強はほぼ宿題だけ、あとはテニスとピアノとゲームの記憶ばっかな年だった"],
      ["四目並べに没頭する","クラスの担任の先生が四目並べが得意で昼休みに生徒と四目並べをすることがあった、4つ並べればいい単純なゲームだが、意外と面白かった、クラスで四目並べトーナメントがあって頭脳（頭の使い方）で負けたくなかったからネットで攻略法とか相手の意識を逸らす方法とかバレずに攻める方法とか調べてから臨んだ、決勝は自分と先生で過去一40分という長さで負けた、年齢の違いだけで負けるんかよ、勝てないのか俺の頭脳はって思って悔しかった\n\nクラスで敵なしレベルまでは上達したのに超えられない壁がすぐそこにあることに対して、これだけ全力でやったのに負けたってことはこれが自分の限界なのかなって勝手に思ってたしそれ以上上手くなる気はなかった\n\nしばらく先生と何度か四目並べをして勝てることもあったが負けることの方が多かった"],
      ["学生時代の一番の親友ができる","テニスで気が合ったり勉強でも気が合ったり会話も気が合ったり見た目も自分に似ていたりと、授業参観で両者の親から兄弟かねと言われるほど仲良かった"]

  {y:"2016年", age:15, stage:"中3", events:[
      ["親友と放課後残って微分積分を黒板に書きまくってた","放課後になると数学と化学が好きだった自分と親友は黒板に問題を書き始め勉強してた、中学の勉強に飽きて高校の内容を勉強してた、他の誰にも邪魔されないその時間が好きだった"],
      ["プライベートでは親友と数学化学パズルの話ばっかりしてた","放課後も終わった後は家に帰るまでの間に話してばっかで18時過ぎることも少なくなかった、それなのにお互いの家の前まで行くのに家に入ったことがない、今思うと不思議だけど当時は相手の家なんぞ興味がなかった、話せてればいいとしか思ってなかった"],
      ["親友とルービックキューブにハマった","最速1分以内で揃えられるレベルまでは極めてた（今はできない）"],
      ["テニスの団体メンバーに選ばれた","最後の夏の大会で団体メンバー10人に選出された、全70人以上、男子だけで45人ほどいる中で選ばれたのだから未経験から3年間頑張った結果が出たと思った、関東大会で敗退したが悔いはない、みんなと同じ土俵に立てただけで結果なんてどうでもよかった\n\nそれよりも大会中の合宿で浜ランという海辺の砂浜をランニングする練習があって死ぬほどきつかった記憶の方が濃い、8kmくらい砂浜を走ったから足が重くて仕方がなかった"],
      ["修学旅行で親友とクラスであまり馴染めていない子と不登校気味の子の男子4人グループだった","修学旅行でグループ決めをする際、4～5人のグループで自由に組んでいいことになってて、もし組めなかった生徒とか揉め事があれば先生が決めるという感じだった、親友は学級委員長で自分は違ったけど同等並みの補佐して仲良かったのもあり親友とは無条件で一緒になった、クラスを見渡す側だった二人だから周りの人たちが組んでいくのを待ってて俺ら組めたらあとは誰でもいいよねって状態だった、同じテニス部でなかなか組めない子を発見してその子を誘って3人になった、他が組み終わり、一人不登校気味で週に数回しか来ない子がいたからその子を入れてあげてもいいんじゃないかって話になって、その子が登校するとクラスではなく特別支援学級にいるから、給食を食べる時に3人で移動して食べて仲良くなりに行ったしプラン練りも上手くやった、おかげで当日は雨だったけど雨用室内ルートもちゃんと準備してたから楽しかった、クラスの省れ者を出さないようにするのは大事だと思ったし親友も同じ気持ちでいたからいいやつだなと思った"],
      ["君の名は。を見てアニメ映画の凄さを知った","受験生だったから8月公開にもかかわらず受験が終わるまで親に禁止されてた、見た過ぎて小説を買ってた、何度も読んだしアフターストーリーとか別の人の視点から書かれた小説とかも全部買って全部読んだ、おかげで時系列も把握したしセリフも大まかに覚えるほどだった\n\n前期落ちたけど気分転換で見に行けることになった、あれだけ知ってるはずの話なのに見たら涙が出た、惹きこまれる何かに言葉が出なかった、ハッピーエンドまで描かれているわけではなかったが余韻の残る終わり方も良いと思った、スッキリしないという意見も多かったが、それが人生だと思わされる何かがあった"],
      ["後期前日夜中3時までポケモンしてた","後期試験の前日もポケモンにハマって布団の中で隠れて夜更かししてた、試験は受ければ受かるんだし朝は親が起こしてくれるから寝坊しないということで平気でポケモンやってた"],
      ["前期で落ちたけど合格組と一緒に外で遊んでた","前期で落ちたくせに絶対受かるだろうという自信があって受かった組と外でサッカーしてた、三者面談でも受かるので大丈夫ですしか言わなかった、親も心配してたがどこに心配する要素があるのかわからないくらい自信があった、だってこの人生の主人公は自分だしピアノだってテニスだって成績良かったし受験程度で落ちるわけないと思った、決して鼻高く過ごして自慢してたわけじゃないが、理由は言わずただ受かるから大丈夫よって言い続けてた"],
      ["後期合格して進学校が決まった","後期合格発表当日、母と見に行って合格した、同じ男子校の進学校へは17人挑んで15人受かってた、内9人はテニス部だった、テニス部最強過ぎた、母は号泣してた受からなかったらどうしようって泣いてた、受からなかったら予備で受かってる私立に行けばいいだけじゃない？としか思わなかった、何がその涙を産んだのかわからなかった、でも今思うと中学生活を母はずっと支えてくれていたわけで、その日々が報われたという何かが母の中であって涙が出たんだろうと思った、自分の人生にしか興味のなかった当時は考えもつかなかった"]

      ["終始宿題とテストの量に絶望","偏差値68の進学校だからか次元が違い過ぎて常に無理無理言ってた、数学の最初の授業で、先生が軽く自己紹介したと思ったら、じゃあ時間勿体ないので授業しますねー68ページ開いてーって、え？1からじゃないんですか？春休みの宿題の範囲はわかってる前提で進められて初手で死んだ記憶がある\n\nゴールデンウィークに問題集4冊に絶望、各教科ほぼ一冊問題集があるのおかしすぎる、毎日一冊やれってことか、終わった、答え移す余裕もなかった、出し損ねた、そこから宿題出さないこともあった"],
      ["TWICEにハマる","ツウィのニュース記事を見て美人過ぎると思って調べたら韓国のグループだと知って、そこからTWICE推しになる、一番推しはサナだった、そこから韓国語の勉強をしてハングル語検定5級を取る、大学受験は英語じゃなくて韓国語で受けるんだって言い張る時期、カラオケでも韓国語で歌う曲が増え、今でも歌える"],
      ["親友と別の高校でもテニス＆パズル＆TWICEで仲が深まる","親友と韓国語だけのカラオケをしたりして現実の勉強ができない自分は現実逃避してた"],
      ["君の名は。の美術作画集を買って絵コンテの仕事に興味を持つ","まだ君の名は。の非現実に酔っていて素晴らしすぎたから絵コンテ集を3000円で当時購入した、そこから作画ってこんなに素晴らしいんだという世界を知った、イラストレーターになりたいとも思った、でもそうなるにはものすごい努力が必要で好きだけどそこまで努力ができないこともセンスがないことも分かっていたから夢で終わった"],
      ["テニス部に入ったけど中学ほど頑張らなかった","中学のテニスがきつすぎたからか高校のテニスは楽だった、あまりにもテニスが強い中学から来てるから1軍のメンバーがほぼ同級生、さすが過ぎた、でも楽とはいえ人間関係がくそ過ぎた、進学校なのに怠惰が酷かった、ここでテニスを伸ばす必要性がないと感じて年内で1軍を降りた"]

{y:"2018年", age:17, stage:"高2", events:[

{y:"2019年", age:18, stage:"高3", events:[
      ["テニス部を辞めた","2軍以下に落ちたことで部活がサークルのレベルまで適当な練習になったからそれならやる意味無いかなと思って辞めた"],
      ["心理学に目覚めた","DAIGOさんのYouTubeを見始めて心理学にハマった時期、人をコントロールできるってすごいと思った、自分自身を律することも学んだ"],
      ["文化祭で目立つ","2年に一回のクラスの文化祭、1年生の時はモブ過ぎて記憶になし、この時の文化祭はリーダー的ポジションで刻まれている\n\n文化祭実行委員を誰がやるのかって話で自分はやらなかった、でも文化祭の出し物でクラスの出し物で全27クラス中1位を取りたい気力はあった（9クラス×3学年）、そこで出し物を考える中、なかなかクラスの中で決まらなかったところでクイズを解いてもらう出し物を提案した、これまでクイズ系で3位以内に入った経歴は一度もないらしいが関係ない、自分にはクイズで楽しませられる未来が見えていたからかなり主張した、それこそ具体的にどうするかまで、説明したらやってみる価値はありそうと言ってもらい、気づけば文化祭実行委員でもないのにその人の上の立場的存在になってた\n\n出し物ではコナンの要素を入れるべく犯人は誰だというクイズ、5つのクイズを答えていき、それぞれの答えから導き出せる犯人を最終的に選択し、正解したらお菓子が倍貰えるという内容、心理学をちょっとかじっていたからか、クラスの人のまとめ方もある程度わかるし、お客さんがどうしたら入ってきてくれて楽しんでくれて印象に残ってくれるかも全部計算して作った\n\n準備期間ではクラスメイト全員の得意や好きなことをある程度把握して役割分担をして全員が準備をしてくれるように促した、実行委員や先生すらも利用できる全てを利用した、クイズの内容は全部自分で考えた、全部自分で考えたけど必ずクラスLINEで匿名アンケートを取った、匿名でダメ出しも受け入れた、全員が参加しているという平等性を取る考えがより団結を産んだと思う\n\n当日はシフト制を取り入れた、男子校の出し物で、近くに女子高があったからそこの生徒も来るし家族や様々な人が来る、だからこそみんな他のクラスを回ったり誰かと一緒に回ったりする時間があった方が絶対いいと思って自分以外の全員のクラス内の立ち回りをシフト化した、しかもシフトを各自一回変更可能付きで。結果うまく回ったし誰も文句がなかった\n\nクラスの出し物は5つのクイズにそれぞれ担当者を割り当て、各担当者はそのクイズだけの流れを覚えればいいので負担を減らす方法も取った、お客さんの回転率を一定化するために各自タイマーを持たせ一定時間経過ごとにヒントを出した、最後のお菓子渡しの後は全問話せる解説者（実行委員）が居て気になるところを解説してもらっていた、自分は常にクラス全体を何周もして休憩時間を入れなかった、シフト制じゃないから好きな時間に休憩できたし仕事してる感も少なかった、今思うと経営者みたいな立ち回りだったと思う\n\n入り口や外で待ってるお客さんに対して中で出すクイズの前の準備段階としてなぞなぞとかクイズを受け付けの人に覚えさせて飽きない工夫を取った、待てる人数にも限りがあるので来たかったけどスルーせざるを得ない状況になることを予想し、前売り券のチケットを準備していた、このチケットがあれば優先的には入れるようになるチケットだ、クラスの出し物の場所は入り口付近、だからこそ人が一番来やすい、来る人にチケットを渡して他のクラスを見てもらって回った後に最後に来て印象付ければ自分たちのクラスに票が入りやすくなるだろうという計算をした、また、一度来てくれた人には出口で明日は問題が変わるのでぜひまた挑戦してくださいと再来を促し、二日間来るとお菓子が倍になるスタンプラリーも導入した、翌日は外の勧誘する人に昨日と違うクイズなので是非来てくださいという勧誘で新鮮さを呼び掛けた\n\nそんな試行錯誤をした2日間で、結果は全クラス2位だった、1位はラウンドワンみたいな遊びをテーマにしたクラスで勝てなかったが、クイズ系で受賞したのは歴代初だったので注目を浴びた、通常はクラスの実行委員が賞を受け取るところをクラスメンバーからの推薦で自分が受け取った、人生で一番楽しかった二日間だと思う"]
    ]},
{y:"2020年", age:19, stage:"大1", events:[

const STAGE_GROUPS = [
{label:"すべて", test:()=>true},
{label:"幼少期", test:a=>a<=6},
{label:"小学生", test:a=>a>=7&&a<=12},
{label:"中学生", test:a=>a>=13&&a<=15},
{label:"高校生", test:a=>a>=16&&a<=18},
{label:"大学生", test:a=>a>=19&&a<=22},
{label:"社会人〜現在", test:a=>a>=23},
  ];

const nav = document.getElementById("stageNav");
const main = document.getElementById("main");
let activeIdx = 0;

function render(){
    main.innerHTML = "";
  const filter = STAGE_GROUPS[activeIdx].test;
  DATA.forEach(group=>{
        if(!filter(group.age)) return;
    const g = document.createElement("div");
    g.className = "yeargroup";
    const dot = document.createElement("div"); dot.className="dot"; g.appendChild(dot);
    const yl = document.createElement("div"); yl.className="yearlabel"; yl.textContent = group.y + "　" + group.age + "歳"; g.appendChild(yl);
    const sl = document.createElement("div"); sl.className="stagelabel"; sl.textContent = group.stage; g.appendChild(sl);

    if(group.events.length===0){
      const e = document.createElement("div"); e.className="empty"; e.textContent="(これから埋める)";
      g.appendChild(e);
} else {
      group.events.forEach(([fact,feel])=>{
        const card = document.createElement("div");
        card.className = "card";
        const f = document.createElement("div");
        f.className = "fact" + (feel ? "" : " nofeel");
        f.textContent = fact;
        card.appendChild(f);
        if(feel){
          const fe = document.createElement("div");
          fe.className = "feel";
          fe.textContent = feel;
          card.appendChild(fe);
          f.addEventListener("click", ()=> card.classList.toggle("open"));
}
        g.appendChild(card);
});
}
    main.appendChild(g);
});
}

STAGE_GROUPS.forEach((s,i)=>{
  const b = document.createElement("button");
  b.textContent = s.label;
  if(i===0) b.classList.add("active");
  b.addEventListener("click", ()=>{
    activeIdx = i;
    [...nav.children].forEach(c=>c.classList.remove("active"));
    b.classList.add("active");
    render();
    window.scrollTo({top:0, behavior:"smooth"});
});
  nav.appendChild(b);
});

render();
</script>
